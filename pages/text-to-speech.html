<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech - Digital Services Hub</title>
    <meta name="description" content="Convert text to natural-sounding speech with our free text-to-speech tool. Multiple voices, languages, and customization options available.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components/text-to-speech.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="tts-container">
        <div class="tts-header">
            <h1 class="tts-title">Text to Speech</h1>
            <div class="tts-actions">
                <button id="clear-btn" class="tts-button secondary" title="Clear text">
                    <i class="fas fa-times"></i> Clear
                </button>
                <button id="paste-btn" class="tts-button secondary" title="Paste from clipboard">
                    <i class="fas fa-paste"></i> Paste
                </button>
                <button id="save-btn" class="tts-button secondary" title="Save as audio file">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
        </div>

        <textarea id="text-input" class="tts-textarea"
            placeholder="Enter or paste your text here (max 5000 characters)..."
            maxlength="5000"
            aria-label="Text to convert to speech"></textarea>

        <div class="tts-info">
            <div id="detected-language">Detected Language: None</div>
            <div id="char-count">0 / 5000 characters</div>
        </div>

        <div class="tts-controls">
            <div class="tts-control">
                <label for="voice-select">Voice:</label>
                <select id="voice-select" aria-label="Select voice">
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="tts-control">
                <label for="speed-slider">Speed: <span id="speed-value">1x</span></label>
                <input type="range" id="speed-slider"
                    min="0.5" max="2" step="0.1" value="1"
                    aria-label="Speech speed">
            </div>

            <div class="tts-control">
                <label for="pitch-slider">Pitch: <span id="pitch-value">1</span></label>
                <input type="range" id="pitch-slider"
                    min="0.1" max="2" step="0.1" value="1"
                    aria-label="Speech pitch">
            </div>

            <div class="tts-control">
                <label for="volume-slider">Volume: <span id="volume-value">100%</span></label>
                <input type="range" id="volume-slider"
                    min="0" max="1" step="0.1" value="1"
                    aria-label="Speech volume">
            </div>
        </div>

        <div class="tts-buttons">
            <button id="preview-btn" class="tts-button secondary">
                <i class="fas fa-headphones"></i> Preview Voice
            </button>
            <button id="speak-btn" class="tts-button">
                <i class="fas fa-play"></i> Speak
            </button>
            <button id="download-btn" class="tts-button secondary">
                <i class="fas fa-download"></i> Download
            </button>
        </div>

        <div class="tts-templates">
            <button class="template-btn" data-template="greeting">
                <i class="fas fa-hand-wave"></i> Greeting
            </button>
            <button class="template-btn" data-template="introduction">
                <i class="fas fa-user"></i> Introduction
            </button>
            <button class="template-btn" data-template="business">
                <i class="fas fa-briefcase"></i> Business
            </button>
            <button class="template-btn" data-template="casual">
                <i class="fas fa-coffee"></i> Casual
            </button>
            <button class="template-btn" data-template="formal">
                <i class="fas fa-pen-fancy"></i> Formal
            </button>
            <button class="template-btn" data-template="farewell">
                <i class="fas fa-hand-peace"></i> Farewell
            </button>
        </div>
    </div>

    <script type="module" src="../js/features/text-to-speech.js"></script>
</body>
</html>
