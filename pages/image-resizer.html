<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer - Digital Services Hub</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="neon-text">Image Resizer</h1>
        
        <nav id="main-nav"></nav>

        <div class="content">
            <div class="theme-toggle">
                <button id="theme-button" class="tech-button small">Toggle Theme</button>
            </div>

            <div class="image-container">
                <div class="drop-message">
                    Drop image here or click to upload
                </div>
                <div class="preview-container">
                    <img src="" alt="Preview" style="display: none;">
                    <div class="preview-overlay">
                        <button class="tech-button small">Change Image</button>
                    </div>
                </div>
                <div class="file-info"></div>
            </div>

            <div class="image-controls">
                <div class="input-group">
                    <div class="dimension-controls">
                        <div>
                            <label for="width">Width:</label>
                            <input type="number" id="width" min="1" step="1">
                        </div>
                        <span class="aspect-ratio-lock" title="Lock aspect ratio">🔒</span>
                        <div>
                            <label for="height">Height:</label>
                            <input type="number" id="height" min="1" step="1">
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="format">Format:</label>
                    <select id="format">
                        <option value="jpeg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                        <option value="gif">GIF</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="quality">Quality: <span id="quality-value">80%</span></label>
                    <input type="range" id="quality" min="1" max="100" value="80">
                </div>
            </div>

            <button id="download-button" class="tech-button" disabled>Download Resized Image</button>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/features/image-resizer.js"></script>
</body>
</html>
