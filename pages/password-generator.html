<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Digital Services Hub</title>
    <meta name="description" content="Generate secure passwords with customizable options and strength indicators.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components/password-generator.css">
    <link rel="stylesheet" href="../css/components/social-share.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation injected by js/components/layout.js -->

    <header class="hero">
        <div class="hero-content">
            <h2 class="hero-title">Password Generator</h2>
            <p class="hero-subtitle">Create strong, secure passwords instantly</p>
        </div>
    </header>

    <main class="container">
        <div class="password-generator">
            <!-- Password Output Section -->
            <div class="password-output">
                <div class="password-display">
                    <input
                        type="text"
                        id="password-output"
                        readonly
                        aria-label="Generated password"
                        placeholder="Click generate to create password"
                    >
                    <div class="password-actions">
                        <button id="copy-password" class="tech-button small" aria-label="Copy password">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button id="generate-password" class="tech-button" aria-label="Generate new password">
                            <i class="fas fa-sync-alt"></i> Generate
                        </button>
                    </div>
                </div>
                <div class="strength-meter" role="meter" aria-label="Password strength" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="strength-label">Strength: <span id="strength-text">None</span></div>
                    <div class="strength-bars">
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Password Options -->
            <div class="password-options">
                <div class="option-group">
                    <label for="password-length">Password Length</label>
                    <div class="length-control">
                        <input
                            type="range"
                            id="password-length"
                            min="8"
                            max="64"
                            value="16"
                            aria-label="Password length"
                        >
                        <span id="length-value">16</span>
                    </div>
                </div>

                <div class="option-group">
                    <h3>Character Types</h3>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="uppercase" checked>
                            <span class="checkbox-text">Uppercase (A-Z)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="lowercase" checked>
                            <span class="checkbox-text">Lowercase (a-z)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="numbers" checked>
                            <span class="checkbox-text">Numbers (0-9)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="symbols" checked>
                            <span class="checkbox-text">Symbols (!@#$%^&*)</span>
                        </label>
                    </div>
                </div>

                <div class="option-group">
                    <h3>Advanced Options</h3>
                    <div class="advanced-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="exclude-similar">
                            <span class="checkbox-text">Exclude Similar Characters (i, l, 1, L, o, 0, O)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="exclude-ambiguous">
                            <span class="checkbox-text">Exclude Ambiguous Characters ({}, [], (), /\, etc.)</span>
                        </label>
                        <div class="custom-chars">
                            <label for="custom-chars-input">Custom Characters (optional)</label>
                            <input
                                type="text"
                                id="custom-chars-input"
                                placeholder="Add specific characters to include"
                                aria-label="Custom characters to include"
                            >
                        </div>
                    </div>
                </div>
            </div>

            <!-- Password Requirements -->
            <div class="password-requirements">
                <h3>Password Requirements</h3>
                <ul class="requirements-list" role="list">
                    <li id="req-length" role="listitem">
                        <i class="fas fa-times"></i> 8-64 characters long
                    </li>
                    <li id="req-uppercase" role="listitem">
                        <i class="fas fa-times"></i> Contains uppercase letter
                    </li>
                    <li id="req-lowercase" role="listitem">
                        <i class="fas fa-times"></i> Contains lowercase letter
                    </li>
                    <li id="req-number" role="listitem">
                        <i class="fas fa-times"></i> Contains number
                    </li>
                    <li id="req-symbol" role="listitem">
                        <i class="fas fa-times"></i> Contains symbol
                    </li>
                </ul>
            </div>

            <!-- Password History -->
            <div class="password-history">
                <div class="history-header">
                    <h3>Recently Generated</h3>
                    <button id="clear-history" class="tech-button small" aria-label="Clear history">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
                <div id="history-list" class="history-list" role="list"></div>
            </div>
        </div>
    </main>

    <!-- Footer injected by js/components/layout.js -->

    <div class="notification" role="alert" aria-live="polite"></div>

    <!-- Load scripts -->
    <script src="../js/utils/app.js" type="module"></script>
    <script src="../js/features/password-generator.js" type="module"></script>
</body>
</html>
