<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator - Digital Services Hub</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="neon-text">Color Palette Generator</h1>
        
        <nav id="main-nav"></nav>

        <div class="content">
            <div class="theme-toggle">
                <button id="theme-button" class="tech-button small">Toggle Theme</button>
            </div>

            <div class="palette-controls">
                <div class="color-picker-container">
                    <canvas></canvas>
                </div>

                <div class="input-group">
                    <label for="harmony">Color Harmony:</label>
                    <select id="harmony">
                        <option value="complementary">Complementary</option>
                        <option value="analogous">Analogous</option>
                        <option value="triadic">Triadic</option>
                        <option value="split-complementary">Split Complementary</option>
                        <option value="tetradic">Tetradic</option>
                    </select>
                    <button id="generate-button" class="tech-button">Generate Harmony</button>
                </div>
            </div>

            <div class="selected-colors"></div>

            <div class="palette-actions">
                <button id="save-button" class="tech-button">Save Palette</button>
                <div class="export-options">
                    <button class="tech-button small" data-format="hex">Copy HEX</button>
                    <button class="tech-button small" data-format="rgb">Copy RGB</button>
                    <button class="tech-button small" data-format="css">Copy CSS Variables</button>
                </div>
            </div>

            <div class="saved-palettes">
                <h3>Saved Palettes</h3>
                <div class="saved-palette-grid"></div>
            </div>
        </div>
    </div>

    <div class="notification"></div>

    <script src="../js/common.js"></script>
    <script src="../js/features/color-palette.js"></script>
</body>
</html>
